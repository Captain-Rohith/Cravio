# ===============================
# APP CONFIG
# ===============================
spring.application.name=Cravio

# Accept enum values like "Customer"
spring.jackson.mapper.accept-case-insensitive-enums=true

# Backend service port
server.port=8090
server.address=0.0.0.0


# ===============================
# DATABASE CONFIG
# ===============================

# PostgreSQL running locally on VM
spring.datasource.url=jdbc:postgresql://localhost:5432/cravio
spring.datasource.username=rv
spring.datasource.password=rv
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate dialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect


# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC


# ===============================
# CONNECTION POOL
# ===============================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000


# ===============================
# SECURITY / JWT
# ===============================
cravio.jwt.secret=change-this-secret-change-this-secret-change-this-secret
cravio.jwt.expiration-millis=3600000


# ===============================
# CORS
# ===============================
cravio.cors.allowed-origins=https://cravio.tech


# ===============================
# TRACKING SERVICE
# ===============================

# Tracking microservice running on same VM
cravio.tracking.base-url=http://localhost:8081
cravio.tracking.max-attempts=3


# ===============================
# DELIVERY CONFIG
# ===============================
cravio.h3.resolution=9
cravio.delivery.discovery-ring-size=2
cravio.delivery.discovery-radius-km=5.0


# ===============================
# ACTUATOR
# ===============================
management.endpoints.web.exposure.include=health,info


# ===============================
# SWAGGER
# ===============================
springdoc.api-docs.path=/api/v1/docs
springdoc.swagger-ui.path=/swagger-ui.html