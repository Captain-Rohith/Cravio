# ===============================
# APP CONFIG
# ===============================
spring.application.name=Cravio

server.port=8090
server.address=0.0.0.0

# ===============================
# DATABASE CONFIG (ENV FIRST)
# ===============================
# VM example (set via systemd env)
# CRAVIO_DB_URL=jdbc:oracle:thin:@cravio_high
# CRAVIO_DB_USERNAME=your_username
# CRAVIO_DB_PASSWORD=your_password

# Local fallback (used only if env vars are missing)
spring.datasource.url=${CRAVIO_DB_URL:jdbc:oracle:thin:@localhost:1521/XE}
spring.datasource.username=${CRAVIO_DB_USERNAME:student}
spring.datasource.password=${CRAVIO_DB_PASSWORD:student123}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ===============================
# CONNECTION POOL
# ===============================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000

# ===============================
# SECURITY / JWT
# ===============================
cravio.jwt.secret=${CRAVIO_JWT_SECRET:change-this-secret-change-this-secret-change-this-secret}
cravio.jwt.expiration-millis=${CRAVIO_JWT_EXPIRATION:3600000}

# ===============================
# CORS
# ===============================
# VM example:
# CRAVIO_CORS_ALLOWED_ORIGINS=https://cravio.tech

# Default supports both local FE and VM domain
cravio.cors.allowed-origins=${CRAVIO_CORS_ALLOWED_ORIGINS:http://localhost:3000,https://cravio.tech}

# ===============================
# TRACKING SERVICE
# ===============================
# Keep localhost for backend -> tracking calls when both services are on same machine
cravio.tracking.base-url=${CRAVIO_TRACKING_BASE_URL:http://localhost:8081}
cravio.tracking.max-attempts=${CRAVIO_TRACKING_MAX_ATTEMPTS:3}

# ===============================
# DELIVERY CONFIG
# ===============================
cravio.h3.resolution=${CRAVIO_H3_RESOLUTION:9}
cravio.delivery.discovery-ring-size=${CRAVIO_DELIVERY_DISCOVERY_RING_SIZE:2}
cravio.delivery.discovery-radius-km=${CRAVIO_DELIVERY_DISCOVERY_RADIUS_KM:5.0}

# ===============================
# ACTUATOR
# ===============================
management.endpoints.web.exposure.include=health,info

# ===============================
# SWAGGER
# ===============================
springdoc.api-docs.path=/api/v1/docs
springdoc.swagger-ui.path=/swagger-ui.html
